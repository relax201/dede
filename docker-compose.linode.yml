# Lean production stack for Linode Nanode 1GB
# Services: redis + postgres(tiny) + backend + frontend
# Usage: docker compose -f docker-compose.linode.yml up -d --build

services:
  redis:
    image: redis:7-alpine
    container_name: tasi_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 96m
    networks: [tasi_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    container_name: tasi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasi_platform
      POSTGRES_USER: tasi_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    mem_limit: 256m
    networks: [tasi_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasi_user -d tasi_platform"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tasi_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tasi_user:${POSTGRES_PASSWORD:-changeme_prod}@db:5432/tasi_platform
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://45.79.193.19,http://45.79.193.19:3000,http://localhost:3000}
      DEBUG: "false"
      SAHMK_WS_ENABLED: "true"
      SAHMK_WS_AUTO_UNIVERSE: "true"
      SAHMK_WS_MAX_SYMBOLS: "60"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 450m
    networks: [tasi_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://45.79.193.19:8000}
        VITE_WS_URL: ${PUBLIC_WS_URL:-ws://45.79.193.19:8000}
    container_name: tasi_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    mem_limit: 64m
    networks: [tasi_net]

volumes:
  postgres_data:

networks:
  tasi_net:
    driver: bridge
