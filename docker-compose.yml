version: '3.8'

services:
  # قاعدة البيانات PostgreSQL
  db:
    image: postgres:14
    container_name: tasi_postgres
    environment:
      POSTGRES_DB: tasi_platform
      POSTGRES_USER: tasi_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasi_user -d tasi_platform"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - tasi_network

  # Redis للتخزين المؤقت
  redis:
    image: redis:6-alpine
    container_name: tasi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - tasi_network

  # الواجهة الخلفية FastAPI
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: tasi_backend
    ports:
      - "5002:5002"
    environment:
      # إعدادات التطبيق
      - APP_NAME=منصة تحليل الأسهم السعودية
      - APP_VERSION=1.0.0
      - DEBUG=false
      
      # قاعدة البيانات
      - DATABASE_URL=postgresql://tasi_user:secure_password_123@db:5432/tasi_platform
      
      # Redis
      - REDIS_URL=redis://redis:6379/0
      
      # الأمان
      - SECRET_KEY=your-super-secret-key-change-this-in-production-123456789
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ALGORITHM=HS256
      
      # مزود البيانات
      - API_PROVIDER=tiingo
      - DATA_API_KEY=${DATA_API_KEY:-your-api-key-here}
      - DATA_API_BASE_URL=https://api.tiingo.com
      
      # تليجرام
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-your-telegram-bot-token}
      
      # البريد الإلكتروني
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-your-email@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-your-app-password}
      - FROM_EMAIL=${FROM_EMAIL:-your-email@gmail.com}
      - FROM_NAME=منصة تحليل الأسهم السعودية
      
      # المنطقة الزمنية
      - TIMEZONE=Asia/Riyadh
      
      # CORS
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000,https://your-domain.com
      
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - tasi_network

  # الواجهة الأمامية React
  frontend:
    build:
      context: ./frontend/tasi-frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:5002
        - REACT_APP_WS_URL=ws://localhost:5002
    container_name: tasi_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost:5002
      - REACT_APP_WS_URL=ws://localhost:5002
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - tasi_network

  # Nginx Reverse Proxy (اختياري للإنتاج)
  nginx:
    image: nginx:alpine
    container_name: tasi_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - tasi_network
    profiles:
      - production

  # مراقبة الصحة والأداء
  monitoring:
    image: prom/prometheus:latest
    container_name: tasi_monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - tasi_network
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local

networks:
  tasi_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

