services:
  db:
    image: postgres:16-alpine
    container_name: tasi_postgres
    environment:
      POSTGRES_DB: tasi_platform
      POSTGRES_USER: tasi_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasi_user -d tasi_platform"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tasi_net]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: tasi_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./database/clickhouse/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks: [tasi_net]

  redis:
    image: redis:7-alpine
    container_name: tasi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [tasi_net]

  kafka:
    image: bitnami/kafka:3.8
    container_name: tasi_kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"
    networks: [tasi_net]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: tasi_mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlartifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlartifacts
    networks: [tasi_net]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tasi_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tasi_user:${POSTGRES_PASSWORD:-changeme_dev_only}@db:5432/tasi_platform
      REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_URL: clickhouse://default:@clickhouse:9000/tasi
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:80,http://frontend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [tasi_net]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000
    container_name: tasi_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks: [tasi_net]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tasi_prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: [monitoring]
    networks: [tasi_net]

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  mlflow_data:

networks:
  tasi_net:
    driver: bridge
