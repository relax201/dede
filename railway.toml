# تاسي فيجن — Railway (خدمة واحدة: API + واجهة)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway.api"

[deploy]
healthcheckPath = "/api/health"
# Startup must answer health quickly; WS warm-up runs in background
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
